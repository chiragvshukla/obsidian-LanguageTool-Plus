name: languagetoolplus

# Only LanguageTool runs in a container. Ollama and the gateway run natively on
# the host and are addressed purely by URL (LT_URL, LLM_BASE_URL in .env).
services:
  languagetool:
    image: erikvl87/languagetool:latest
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      # LanguageTool loads grammar_custom.xml from its rules directory at
      # startup when the file exists. No rebuild needed.
      - ./rules/grammar_custom.xml:/LanguageTool/org/languagetool/rules/de/grammar_custom.xml:ro
    restart: unless-stopped